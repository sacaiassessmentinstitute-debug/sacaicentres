<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACAI Exam Centres</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20n6aJ6g5s6o59G6J9Q7e8d0w9t/Q56J5/z1i/Q1f6Ww="
    crossorigin=""></script>

<script>
    // Initialize the map centered on South Africa
    const map = L.map('map').setView([-29.5, 24.5], 6);

    // Add OpenStreetMap tiles with correct attribution
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer group for markers
    let centreMarkers = L.layerGroup().addTo(map);

    // Function to display markers for a selected province
    function displayCentres(provinceCode, centres) {
        centreMarkers.clearLayers();
        centres.forEach(centre => {
            // If provinceCode is null (or undefined), display all centres. Otherwise, filter by province.
            if (!provinceCode || centre.province_code === provinceCode) {
                L.marker([centre.lat, centre.lon])
                    .addTo(centreMarkers)
                    .bindPopup(`<b>${centre.name}</b>`);
            }
        });
    }

    // Style for provinces
    function style(feature) {
        return {
            fillColor: '#8da0cb',
            weight: 2,
            opacity: 1,
            color: 'white',
            fillOpacity: 0.7
        };
    }

    // Interaction for provinces
    function onEachFeature(feature, layer) {
        const provinceCode = feature.properties.id;
        const provinceName = feature.properties.name;

        layer.on({
            click: function (e) {
                map.fitBounds(e.target.getBounds());
                displayCentres(provinceCode, window.centresData);
                L.popup()
                    .setLatLng(e.latlng)
                    .setContent(`Viewing <b>${provinceName}</b> centres`)
                    .openOn(map);
            },
            mouseover: function (e) {
                e.target.setStyle({ weight: 4, color: '#666', fillOpacity: 0.9 });
            },
            mouseout: function (e) {
                e.target.setStyle(style(feature));
            }
        });

        layer.bindPopup(provinceName);
    }

    // Load province boundaries (za.json)
    fetch('za.json')
        .then(response => response.json())
        .then(data => {
            L.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);
        })
        .catch(error => console.error('Error loading za.json:', error));

    // Load centres data (centres.json)
    fetch('centres.json')
        .then(response => response.json())
        .then(data => {
            window.centresData = data; // Store globally for use in displayCentres
        })
        .catch(error => console.error('Error loading centres.json:', error));
</script>

</body>
</html>
